<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozon-test</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>

<body class="body">
    <div class="container">
        <div class="progress"></div>

        <div class="progress-settings">
            <label class="progress-label label">
                <input class="progress-input" type="number" min="0" max="100" value="30">
                <span class="progress-value">Value</span>

            </label>

            <label class="animate-label label">
                <input class="progress-animate checkbox" id="animate" type="checkbox">
                <span class="checkmark"></span>
                Animate
            </label>

            <label class="animate-label label">
                <input class="progress-hidden checkbox" type="checkbox">
                <span class="checkmark"></span>
                Hide
            </label>
        </div>
    </div>
</body>

</html>
